# ============================================================
# 微家事 · 境内中继（反向代理）参考配置
# 适用：BaoTa(宝塔) 面板 / 原生 nginx
# 作用：your-gateway-domain.example.com 作为【备案域名门面】，微信小程序只认它；
#      /api/* 反向代理到 Cloudflare Worker（CF 侧无需备案）。
# ============================================================

server {
    listen 443 ssl http2;
    server_name your-gateway-domain.example.com;

    # ---- SSL（BaoTa 可在面板一键签发 Let's Encrypt；下面为占位路径）----
    ssl_certificate     /www/server/panel/vhost/cert/your-gateway-domain.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/your-gateway-domain.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ---- 根路径：隐私政策 / 关于页（满足备案"站点需有实际内容"要求）----
    root /www/wwwroot/your-gateway-domain.example.com;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API 反向代理：剥离 /api 前缀转发到 Cloudflare 中间层组件 ----
    # 前端请求 /api/todos → 这里转发为中间层组件 your-cloudflare-domain.example.com 的 /todos
    # ⚠️ your-cloudflare-domain.example.com 是部署在 Cloudflare 的独立非备案域名（中间层组件），
    #    由 wrangler.toml 的 routes 绑定；微信小程序只认 your-gateway-domain.example.com，不直接接触它。
    #    如用其他中间层域名，替换下面地址即可。
    location /api/ {
        proxy_pass https://your-cloudflare-domain.example.com/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传客户端携带的鉴权头（用户 Bearer token 与 relay 内部密钥）
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Sync-Key        $http_x_sync_key;
        # Cloudflare 需要 SNI（必须开启，否则 TLS 握手失败）
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 隐私页等静态资源缓存
    location ~* \.(html?|css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}

# 80 → 443 跳转（BaoTa 通常已自动生成，如已存在可删除此段）
server {
    listen 80;
    server_name your-gateway-domain.example.com;
    return 301 https://$host$request_uri;
}
